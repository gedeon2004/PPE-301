{% load static %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.0/gsap.min.js"></script>

<style>
    :root {
        --primary-orange: #FF7F00;
        --dark-orange: #E67300;
        --black: #000000;
        --white: #FFFFFF;
        --light-gray: #F5F5F5;
        --dark-gray: #333333;
        --red: #D32F2F;
        --green: #388E3C;
    }

    body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--light-gray);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 20px;
    }

    .login-container {
        max-width: 500px;
        width: 100%;
        margin: 20px;
        padding: 50px;
        background: var(--white);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        border: 3px solid var(--primary-orange);
        position: relative;
        overflow: hidden;
    }

    .login-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background: linear-gradient(90deg, var(--primary-orange), var(--dark-orange));
    }

    .form-header {
        text-align: center;
        margin-bottom: 40px;
    }

    .form-header img {
        height: 120px;
        margin-bottom: 20px;
        transition: transform 0.4s ease;
    }

    .form-header img:hover {
        transform: scale(1.05);
    }

    h2 {
        color: var(--black);
        font-weight: 700;
        text-align: center;
        margin-bottom: 30px;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .form-group {
        position: relative;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--dark-gray);
        font-size: 15px;
    }

    .input-wrapper {
        position: relative;
    }

    input {
        width: 100%;
        padding: 15px 45px 15px 20px;
        font-size: 16px;
        border: 2px solid #DDD;
        border-radius: 8px;
        transition: all 0.3s;
        background-color: var(--white);
    }

    input:focus {
        border-color: var(--primary-orange);
        box-shadow: 0 0 0 3px rgba(255, 127, 0, 0.2);
        outline: none;
    }

    .input-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--dark-gray);
    }

    .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: var(--dark-gray);
    }

    .btn-login {
        background-color: var(--primary-orange);
        color: var(--white);
        border: none;
        padding: 16px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .btn-login:hover {
        background-color: var(--dark-orange);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 127, 0, 0.3);
    }

    .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }

    .remember-me {
        display: flex;
        align-items: center;
    }

    .remember-me input {
        width: auto;
        margin-right: 8px;
    }

    .forgot-password {
        color: var(--primary-orange);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s;
    }

    .forgot-password:hover {
        color: var(--dark-orange);
        text-decoration: underline;
    }

    .social-login {
        margin-top: 30px;
        text-align: center;
    }

    .social-login p {
        color: var(--dark-gray);
        margin-bottom: 15px;
        position: relative;
    }

    .social-login p::before,
    .social-login p::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 30%;
        height: 1px;
        background: #DDD;
    }

    .social-login p::before {
        left: 0;
    }

    .social-login p::after {
        right: 0;
    }

    .social-icons {
        display: flex;
        justify-content: center;
        gap: 15px;
    }

    .social-icon {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 20px;
        transition: all 0.3s;
    }

    .social-icon:hover {
        transform: translateY(-3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .facebook {
        background-color: #3b5998;
    }

    .google {
        background-color: #DB4437;
    }

    .twitter {
        background-color: #1DA1F2;
    }

    .register-link {
        text-align: center;
        margin-top: 30px;
        color: var(--dark-gray);
        font-size: 15px;
    }

    .register-link a {
        color: var(--primary-orange);
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s;
    }

    .register-link a:hover {
        color: var(--dark-orange);
        text-decoration: underline;
    }

    /* Error styling */
    .error-message {
        color: var(--red);
        font-size: 13px;
        margin-top: 5px;
    }

    /* Animation */
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-5px); }
        40%, 80% { transform: translateX(5px); }
    }
</style>

<!-- Login Form -->
<div class="login-container">
    <div class="form-header">
        <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo"> 
    </div>
    <h2>Connexion</h2>

    {% if form.errors %}
    <div class="alert alert-danger" role="alert">
        Identifiants incorrects. Veuillez réessayer.
    </div>
    {% endif %}

    <form method="post" id="loginForm" novalidate>
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_login">Nom d'utilisateur ou Email</label>
            <div class="input-wrapper">
                <input type="text" name="login" id="id_login" required autofocus>
                <i class="fas fa-user input-icon"></i>
            </div>
            <div class="error-message" id="login_error"></div>
        </div>
    
        <div class="form-group">
            <label for="id_password">Mot de passe</label>
            <div class="input-wrapper">
                <input type="password" name="password" id="id_password" required>
                <i class="fas fa-eye password-toggle" id="togglePassword"></i>
            </div>
            <div class="error-message" id="password_error"></div>
        </div>

        <div class="login-options">
            <div class="remember-me">
                <input type="checkbox" id="remember_me" name="remember_me">
                <label for="remember_me" style="margin-bottom: 0; font-weight: 500;">Se souvenir de moi</label>
            </div>
            <a href="{% url 'password_reset' %}" class="forgot-password">Mot de passe oublié ?</a>
        </div>
    
        <button type="submit" class="btn-login">Se connecter</button>
    </form>

    <div class="social-login">
        <p>Ou connectez-vous avec</p>
        <div class="social-icons">
            <a href="#" class="social-icon facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon google"><i class="fab fa-google"></i></a>
            <a href="#" class="social-icon twitter"><i class="fab fa-twitter"></i></a>
        </div>
    </div>
    
    <p class="register-link">Pas encore de compte ? <a href="{% url 'signup' %}">S'inscrire</a></p>
</div>

<!-- GSAP Animation -->
<script>
    // Initialisation GSAP
    gsap.from(".login-container", {
        duration: 1,
        y: 50,
        opacity: 0,
        ease: "power3.out"
    });
    
    gsap.from(".logo", {
        duration: 1.2,
        scale: 0.8,
        opacity: 0,
        rotation: -5,
        ease: "back.out(1.7)",
        delay: 0.3
    });
    
    gsap.from("h2", {
        duration: 0.8,
        y: 20,
        opacity: 0,
        delay: 0.6
    });
    
    gsap.from(".form-group", {
        duration: 0.6,
        y: 20,
        opacity: 0,
        stagger: 0.1,
        delay: 0.8
    });
    
    gsap.from(".login-options", {
        duration: 0.6,
        y: 20,
        opacity: 0,
        delay: 1.2
    });
    
    gsap.from(".btn-login", {
        duration: 0.8,
        y: 20,
        opacity: 0,
        delay: 1.4
    });
    
    gsap.from(".social-login", {
        duration: 0.8,
        y: 20,
        opacity: 0,
        delay: 1.6
    });
    
    gsap.from(".register-link", {
        duration: 0.8,
        y: 20,
        opacity: 0,
        delay: 1.8
    });

    // Afficher/masquer le mot de passe
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('id_password');
    
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // Validation du formulaire
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        let isValid = true;
        const login = document.getElementById('id_login').value.trim();
        const password = document.getElementById('id_password').value.trim();
        
        if (!login) {
            document.getElementById('login_error').textContent = "Veuillez entrer votre nom d'utilisateur ou email";
            isValid = false;
        } else {
            document.getElementById('login_error').textContent = "";
        }
        
        if (!password) {
            document.getElementById('password_error').textContent = "Veuillez entrer votre mot de passe";
            isValid = false;
        } else {
            document.getElementById('password_error').textContent = "";
        }
        
        if (!isValid) {
            e.preventDefault();
            gsap.to(".error-message:not(:empty)", {
                duration: 0.4,
                keyframes: {
                    "0%": { x: -5 },
                    "20%": { x: 5 },
                    "40%": { x: -5 },
                    "60%": { x: 5 },
                    "80%": { x: -5 },
                    "100%": { x: 0 }
                },
                ease: "power1.inOut"
            });
        }
    });
</script>

{% endblock %}
